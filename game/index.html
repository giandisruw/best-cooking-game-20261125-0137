<title>Ember Lane Kitchen — a street-food cooking game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a12; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #3a2e24; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Lane Kitchen: run a street-food stall, chop and cook ingredients, build plates and serve orders before their timers run out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
